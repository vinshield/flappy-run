<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A polished Flappy Bird-inspired browser game with start.ng character integration."
    />
    <title>StartNG Flap</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">START.NG</p>
            <h1>Flappy Run</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="muteToggle" class="icon-button" type="button" aria-label="Toggle sound">
            🔊
          </button>
        </div>
      </header>

      <main class="game-panel" aria-live="polite">
        <div class="hud">
          <div class="badge">
            <span class="label">Score</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="badge secondary">
            <span class="label">Best</span>
            <strong id="bestValue">0</strong>
          </div>
        </div>

        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="420" height="640" aria-label="Flappy game area"></canvas>

          <div id="overlay" class="overlay visible" role="dialog" aria-live="assertive">
            <div class="panel card">
              <p class="eyebrow accent">Arcade challenge</p>
              <h2 id="overlayTitle">Flappy Run</h2>
              <p id="overlayMessage">
                Tap, click, or press space to start flying through the neon skyline.
              </p>

              <div class="player-card" id="playerCard">
                <div class="avatar" id="playerAvatar" aria-label="Player avatar"></div>
                <div class="player-meta">
                  <strong id="playerName">Guest</strong>
                  <span id="playerAccount">Not signed in</span>
                </div>
              </div>

              <div class="button-row">
                <button id="startButton" class="primary-button" type="button">Start run</button>
                <button id="signInButton" class="secondary-button hidden" type="button">Sign in</button>
              </div>

              <div class="score-summary hidden" id="scoreSummary">
                <div>
                  <span class="label">Final score</span>
                  <strong id="finalScore">0</strong>
                </div>
                <div>
                  <span class="label">Best</span>
                  <strong id="finalBest">0</strong>
                </div>
              </div>

              <p id="platformStatus" class="platform-status"></p>
            </div>
          </div>
        </div>

        <aside class="leaderboard-panel card" aria-label="Leaderboard">
          <div class="leaderboard-header">
            <h3>Leaderboard</h3>
            <span id="leaderboardState" class="state-pill">loading</span>
          </div>
          <ol id="leaderboardList" class="leaderboard-list"></ol>
          <p id="leaderboardHint" class="leaderboard-hint">
            Scores sync with start.ng when available.
          </p>
        </aside>
      </main>
    </div>

    <script src="./startng.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
